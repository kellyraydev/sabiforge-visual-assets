name: materialize-assets
on:
  push:
    paths:
      - ".github/workflows/materialize-assets.yml"
      - "library/encoded/**"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/materialize_binaries.py
      - run: |
          git config user.name "KellyRay Dev"
          git config user.email "kellyray.dev@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Decode image masters and web derivatives"
          git push
